# Quality gates, one job per directory (shared, api, client, admin) plus Docker
# build checks. Runs on every pull request (any base branch, so stacked PRs are
# checked) and every push to main. There is no root package.json: each job
# installs and runs from its own directory, shared/ first (it owns zod; the
# other packages link to shared/node_modules/zod).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared (tsc, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v7

      # Bun version comes from mise.toml so CI and local dev never drift.
      - name: Read Bun version from mise.toml
        id: bun
        working-directory: .
        run: echo "version=$(sed -n 's/^bun *= *"\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('shared/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Test
        run: bun test

  api:
    name: api (tsc, lint, test, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      # Same Postgres major as docker-compose.yml.
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Read Bun version from mise.toml
        id: bun
        working-directory: .
        run: echo "version=$(sed -n 's/^bun *= *"\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('shared/bun.lock', 'api/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install shared (owns zod), then api
        run: |
          (cd ../shared && bun install --frozen-lockfile)
          bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint .

      # BUDGET_REQUIRE_TEST_DB=1 makes an unavailable test DB fatal in the
      # preload, so DB-backed suites can never skip silently. The preload
      # creates budgetnew_test on the service container.
      - name: Test
        env:
          BUDGET_REQUIRE_TEST_DB: "1"
        run: bun test

      # Auth-on OAuth + MCP flow over HTTP (no Temporal needed). e2e-jobs and
      # e2e-connections need a Temporal server and are not run in CI.
      - name: e2e (MCP over HTTP, OAuth consent)
        working-directory: .
        run: scripts/e2e-api.sh

  client:
    name: client (tsc, lint, test, expo-doctor, web export)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Read Bun version from mise.toml
        id: bun
        working-directory: .
        run: echo "version=$(sed -n 's/^bun *= *"\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      # The expo CLI is a node program.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('shared/bun.lock', 'client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install shared (owns zod), then client
        run: |
          (cd ../shared && bun install --frozen-lockfile)
          bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Test
        run: bun test
      - name: expo-doctor
        run: bunx expo-doctor
      - name: Web export
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform web --output-dir dist/web

  admin:
    name: admin (tsc, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Read Bun version from mise.toml
        id: bun
        working-directory: .
        run: echo "version=$(sed -n 's/^bun *= *"\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('shared/bun.lock', 'admin/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install shared (owns zod), then admin
        run: |
          (cd ../shared && bun install --frozen-lockfile)
          bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  docker:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: docker/Dockerfile.web
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: admin
            dockerfile: docker/Dockerfile.admin
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (single arch, no push): proves the Dockerfiles and lockfiles.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false
          sbom: false
