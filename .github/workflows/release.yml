# Server release: build + publish the web, api and admin images for an
# existing version marker and roll the cluster. The iOS app is NOT part of this
# workflow: it has its own version (client/VERSION), tag (app-v<VERSION>) and
# workflow (app-release.yml); see docs/decisions.md 2026-11-23.
#
# Triggers: version.yml's workflow_dispatch after it cuts the v<VERSION> tag,
# a direct `v*` tag push (rescue path: builds that exact tag), or a manual
# workflow_dispatch (empty input re-releases the current api/VERSION: re-push
# images, pin again; every step is idempotent).
#
# Jobs:
#   resolve - derive the version (dispatch input > tag name > api/VERSION) and
#             fail fast on a malformed value.
#   images  - build and push the web, api and admin Docker images to GHCR
#             (linux/amd64 + linux/arm64; tags: latest, <version>, sha).
#   deploy  - pin <version> in k8s/values.yaml on main (ArgoCD rolls the
#             Deployments from it; budget-worker takes the budget-api tag)
#             and create the idempotent GitHub release.
#
# Repo secrets:    GITHUB_TOKEN is provided by Actions.
name: Release

on:
  push:
    tags:
      # Server tags only: `v2026.11.23`. App tags (`app-v...`) do not match.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (YYYY.MM.DD[-NN]; empty re-releases the current api/VERSION)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < api/VERSION)"
          fi
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]{2})?$ ]]; then
            echo "::error::version must be YYYY.MM.DD[-NN], got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Build ${{ matrix.name }} image
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: deploy/Dockerfile.web
            image: budget-web
          - name: api
            dockerfile: deploy/Dockerfile.api
            image: budget-api
          - name: admin
            dockerfile: deploy/Dockerfile.admin
            image: budget-admin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      # Build the exact tag being released (rescue-path tag pushes included).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || '' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy (ArgoCD rollout)
    needs: [resolve, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin image tags (ArgoCD rolls the deployments from this)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit on top of current main: never roll main back to an older
          # ref (this run may have been triggered by a tag of an older SHA).
          git fetch origin main
          git checkout -B deploy-pin origin/main
          # budget-worker runs the budget-api image, so it takes the same tag.
          sed -i "s/^  budget-web: .*/  budget-web: ${VERSION}/; s/^  budget-api: .*/  budget-api: ${VERSION}/; s/^  budget-worker: .*/  budget-worker: ${VERSION}/; s/^  budget-admin: .*/  budget-admin: ${VERSION}/" k8s/values.yaml
          if git diff --quiet -- k8s/values.yaml; then
            echo "k8s/values.yaml already pins ${VERSION}, nothing to commit (idempotent re-run)"
            exit 0
          fi
          git add k8s/values.yaml
          git commit -m "deploy: images ${VERSION}"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: workflow_dispatch re-runs of an already-released version
        # must not fail here. Body: the section for this version from
        # CHANGELOG.md at the tag (version.yml tags the notes commit);
        # --generate-notes covers rescue-path tags without a matching section.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
          else
            # Mapped refspec: a bare `refs/tags/X` fetch writes FETCH_HEAD only
            # and never creates the local tag, so git show would fail.
            git fetch --quiet origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" 2>/dev/null || true
            notes="$(git show "refs/tags/v${VERSION}:CHANGELOG.md" 2>/dev/null \
              | awk -v marker="## v${VERSION} " '
                index($0, marker) == 1 {f=1; next}
                f && /^## / {exit}
                f {print}
              ' | sed -e '/./,$!d')"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes" > release-notes.md
              gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
              rm release-notes.md
            else
              gh release create "v$VERSION" --title "v$VERSION" --generate-notes
            fi
          fi
