# busybox httpd config for the Budget static bundles (web and admin images).
# SPA fallback: any unmatched route serves /index.html so the SPA router
# takes over (deep links, dynamic routes).
# Absolute path: busybox resolves the E404 page against the daemon's cwd
# (container root), not the -h home — a bare /index.html 404s here.
E404:/www/index.html

# Cache hashed static assets aggressively.
A:*

# MIME types busybox does not know by default.
.js:text/javascript
.mjs:text/javascript
.css:text/css
.json:application/json
.wasm:application/wasm
.svg:image/svg+xml
.ttf:font/ttf
.woff:font/woff
.woff2:font/woff2
